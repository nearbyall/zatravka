<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}zatravka{% endblock %}</title>
  <link rel="preload" href="/static/fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v=3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16z' fill='%231b4bd6'/%3E%3C/svg%3E">
  <script src="/static/theme.js?v=3"></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <header class="top">
    <a class="mark" href="/" aria-label="zatravka, все идеи">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 30 16 16 30 2 16z"/><path class="facet" d="M16 2 22 16 16 30 10 16z"/></svg>
      zatravka
    </a>
    <nav class="nav" aria-label="Разделы">
      <a href="/" {% if nav in ('ideas', 'idea') %}aria-current="page"{% endif %}>Идеи</a>
      <a href="/posts" {% if nav == 'posts' %}aria-current="page"{% endif %}>Посты</a>
      <a href="/directions" {% if nav == 'directions' %}aria-current="page"{% endif %}>Направления</a>
      <a href="/runs" {% if nav == 'runs' %}aria-current="page"{% endif %}>Прогоны</a>
    </nav>
    <div class="top-tools">
      <a class="spend{% if budget and spent_today >= budget %} spend-over{% endif %}" href="/runs"
         title="Расход на ИИ сегодня из дневного бюджета">
        <span class="spend-label">ИИ сегодня</span>
        <span class="spend-num">${{ '%.2f' | format(spent_today) }} из ${{ '%.2f' | format(budget) }}</span>
        <span class="spend-bar" style="--t: {{ [spent_today / budget if budget else 0, 1] | min }}"></span>
      </a>
      <button class="btn btn-primary" id="run-btn" type="button" {% if runner.running %}data-running{% endif %}>
        {% if runner.running %}Прогон идёт{% else %}Запустить прогон{% endif %}
      </button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Сменить тему" title="Сменить тему">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path class="fill" d="M12 3.5a8.5 8.5 0 0 1 0 17z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap{% if nav == 'ideas' %} wrap-wide{% endif %}">
    {% block main %}{% endblock %}
  </main>

  <aside class="runlog" id="runlog" hidden aria-live="polite">
    <div class="runlog-head">
      <strong id="runlog-title">Прогон идёт</strong>
      <span id="runlog-time"></span>
      <button class="icon-btn" id="runlog-close" type="button" aria-label="Скрыть журнал">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <pre id="runlog-lines"></pre>
    <div class="runlog-foot" id="runlog-foot" hidden>
      <a class="btn" href="">Обновить страницу</a>
    </div>
  </aside>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/static/app.js?v=3" defer></script>
</body>
</html>
