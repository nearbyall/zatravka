[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideaminer"
version = "0.1.0"
description = "Automated discovery of product ideas in Reddit, X and Threads feeds with an LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "defusedxml>=0.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ideaminer = "ideaminer.cli:main"

[tool.setuptools.packages.find]
include = ["ideaminer*"]

[tool.setuptools.package-data]
ideaminer = ["prompts/*.md", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
