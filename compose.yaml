# Демон по расписанию + веб-интерфейс на одной базе SQLite (data/ideaminer.db).
#   docker compose up -d --build      — запустить оба (демон тратит ИИ-бюджет по расписанию)
#   docker compose up -d web          — только интерфейс, без автоматических прогонов
#   docker compose logs -f worker     — смотреть прогоны
#   docker compose down               — остановить (данные в ./data сохраняются)
services:
  worker:
    build: .
    command: ["ideaminer", "daemon"]
    user: "${IDEAMINER_UID:-1000}:${IDEAMINER_GID:-1000}"
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m

  web:
    build: .
    command: ["ideaminer", "serve", "--host", "0.0.0.0", "--port", "8610"]
    user: "${IDEAMINER_UID:-1000}:${IDEAMINER_GID:-1000}"
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8610:8610"
    restart: unless-stopped
    mem_limit: 384m
