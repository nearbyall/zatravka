# The scheduled daemon and the web UI share one SQLite database (data/ideaminer.db).
#   docker compose up -d --build    start both (the daemon spends the LLM budget on schedule)
#   docker compose up -d web        the UI only, no scheduled runs
#   docker compose logs -f worker   follow the runs
#   docker compose down             stop (data in ./data is kept)
services:
  worker:
    build: .
    command: ["ideaminer", "daemon"]
    user: "${IDEAMINER_UID:-1000}:${IDEAMINER_GID:-1000}"
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m

  web:
    build: .
    command: ["ideaminer", "serve", "--host", "0.0.0.0", "--port", "8610"]
    user: "${IDEAMINER_UID:-1000}:${IDEAMINER_GID:-1000}"
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8610:8610"
    restart: unless-stopped
    mem_limit: 384m
