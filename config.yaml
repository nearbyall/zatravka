# ─────────────────────────────────────────────────────────────────────────────
#  Направления исследования. Каждый прогон берёт core_directions + несколько
#  случайных (направления с лучшей отдачей выпадают чаще). ИИ-исследователь
#  со временем добавляет свои направления в БД (видны во вкладке «Направления»).
#  Поля: subreddits, reddit_search (поиск по Reddit), x_queries (синтаксис X API v2),
#  threads_queries (ключевые слова Threads), weight (базовый вес).
# ─────────────────────────────────────────────────────────────────────────────
directions:
  pain_hunting:
    name: "Охота за болями (универсально)"
    weight: 1.0
    search_scope: site
    subreddits: [NoStupidQuestions, mildlyinfuriating, shutupandtakemymoney, INEEEEDIT, Entrepreneur]
    reddit_search:
      - '"I wish there was an app"'
      - '"is there an app that"'
      - '"I would pay for"'
      - '"someone should make"'
      - '"why is there no app"'
      - '"looking for a tool"'
      - '"is there a tool"'
    # X берёт деньги за отданные посты, а не за запросы: фразы склеены через OR,
    # чтобы каждый запрос заполнял все max_results мест
    x_queries:
      - '("I wish there was an app" OR "wish there was a tool" OR "someone should build" OR "someone needs to make an app") lang:en'
      - '("I would pay for" OR "I''d pay for" OR "shut up and take my money") (app OR tool OR service) lang:en'
      - '("why is there no app" OR "why isn''t there an app" OR "is there an app that" OR "is there a tool that") lang:en'
      - '("хоть бы кто-нибудь сделал" OR "почему до сих пор нет" OR "есть ли приложение" OR "есть ли сервис" OR "посоветуйте приложение" OR "заплатил бы за") lang:ru'
    threads_queries:
      - "I wish there was an app"
      - "someone should build"
      - "would pay for a tool"
      - "есть ли сервис"
      - "почему никто не сделал"

  saas_founders:
    name: "SaaS и инди-основатели"
    subreddits: [SaaS, startups, SideProject, indiehackers, microsaas, EntrepreneurRideAlong, nocode]
    reddit_search: ['"biggest pain" customers', '"what tool do you use" for']
    x_queries: ['("my customers keep asking" OR "users keep asking for") lang:en', '"indie hacker" ("pain point" OR "problem") lang:en']
    threads_queries: ["customers keep asking for", "indie hacker pain point"]

  small_business_ops:
    name: "Малый бизнес: операционка"
    subreddits: [smallbusiness, sweatystartup, restaurateur, Bookkeeping, consulting, AutoDetailing, Construction]
    reddit_search: ['"how do you keep track"', '"we still use spreadsheets"', '"invoicing" nightmare']
    x_queries: ['"small business owner" ("so tired of" OR "nightmare") lang:en', '"малый бизнес" (бесит OR неудобно) lang:ru']
    threads_queries: ["small business owner struggle", "предприниматель неудобно"]

  ecommerce:
    name: "E-commerce и селлеры"
    subreddits: [ecommerce, shopify, FulfillmentByAmazon, EtsySellers, AmazonSeller, Etsy]
    reddit_search: ['"returns" problem seller', '"inventory" manually']
    x_queries: ['("shopify" OR "etsy") ("wish there was" OR "pain") lang:en', '("селлер" OR "вайлдберриз" OR "озон") (бесит OR "нет сервиса") lang:ru']
    threads_queries: ["etsy seller problem", "селлер маркетплейс боль"]

  gaming_players:
    name: "Игры: игроки"
    subreddits: [gaming, patientgamers, truegaming, boardgames, rpg, DnD, Steam]
    reddit_search: ['"I wish games would"', '"why don''t more games"', '"game idea"']
    x_queries: ['("I wish games" OR "why don''t more games") lang:en', '"хочу игру" (где OR чтобы) lang:ru']
    threads_queries: ["I wish there was a game", "хочу игру где"]

  game_dev:
    name: "Игры: разработчики"
    subreddits: [gamedev, IndieDev, godot, Unity3D, gamedesign]
