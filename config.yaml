# ─────────────────────────────────────────────────────────────────────────────
#  ideaminer — главный конфиг. Код не трогаем: всё настраивается здесь.
#  Пути относительны этого файла. Секреты лежат в .env (см. .env.example).
# ─────────────────────────────────────────────────────────────────────────────

# Язык, на котором ИИ формулирует идеи. Цитаты-доказательства остаются на языке оригинала.
output_language: ru

storage:
  db_path: data/ideaminer.db
  inbox_dir: data/inbox          # сюда можно класть JSON/JSONL/CSV с постами для импорта
  exports_dir: data/exports
  digests_dir: data/digests
  prompts_dir: null              # своя папка с промптами (по умолчанию — ideaminer/prompts)

http:
  user_agent: "ideaminer/0.1 (personal research of public posts)"
  timeout_s: 30
  max_retries: 3
  max_rate_wait_s: 120           # дольше этого ждать сброса лимита площадки не будем
  # Минимальная пауза между запросами к одному хосту, сек. Вежливость к площадкам.
  min_interval_s:
    www.reddit.com: 6.0           # публичный RSS Reddit строго лимитирован; клиент ещё и читает x-ratelimit-*
    oauth.reddit.com: 1.0
    api.x.com: 1.5
    graph.threads.net: 1.0
    default: 1.0

schedule:
  run_every_minutes: 240         # демон запускает полный прогон раз в N минут
  jitter_minutes: 15             # случайный сдвиг, чтобы не долбить в одно и то же время
  digest_hour_utc: 6             # раз в сутки после этого часа собирается дайджест

budget:
  # ВНИМАНИЕ: ключ DeepSeek общий с demo-проектами. Полный прогон стоит ≈ $0.09,
  # поэтому дневной лимит пропускает 1–2 прогона. С отдельным ключом поднимите daily_usd.
  daily_usd: 0.15
  per_run_usd: 0.12

llm:
  providers: [deepseek, replicate]   # порядок = приоритет; следующий — запасной
  concurrency: 4
  timeout_s: 120
  deepseek:
    base_url: https://api.deepseek.com
    models:                          # модель на каждый этап
      triage: deepseek-flash
      extract: deepseek-flash
      classify: deepseek-flash
      merge: deepseek-flash
      explore: deepseek-flash
  replicate:
    model: openai/gpt-5-mini
    reasoning_effort: minimal
  # USD за 1M токенов; используется для учёта и бюджета. deepseek-flash откалиброван 2026-11-06
  # по списаниям с баланса на двух прогонах (≈ ¥2 вход, ¥8 выход за 1M токенов).
  prices_usd_per_mtok:
    deepseek-flash:    {in: 0.28,  cached_in: 0.028,  out: 1.10}
    deepseek-v4-pro:   {in: 0.435, cached_in: 0.0036, out: 0.87}
    openai/gpt-5-mini: {in: 0.25,  cached_in: 0.025,  out: 2.0}

sources:
  reddit:
    enabled: true
    mode: auto                 # auto: OAuth при наличии ключей, иначе публичный RSS; rss | oauth
    # Веса случайного выбора типа ленты для каждого фида
    listings: {top_week: 3, hot: 2, new: 1, top_month: 1}
    # Публичный RSS пускает примерно 1 запрос в минуту, поэтому сабреддиты склеиваются
    # в мульти-ленты (r/a+b+c), а запросов за прогон немного. С OAuth (100 запросов/мин)
    # можно смело поднять feeds_per_direction и comments_for_top_posts.
    subs_per_feed: 6           # сколько сабреддитов в одной мульти-ленте
    feeds_per_direction: 1
    searches_per_direction: 1
    items_per_feed: 100
    comments_for_top_posts: 6  # сколько лучших постов прогона (любой площадки) дополнить комментариями
    comments_per_post: 15
  x:
    enabled: auto              # включится, если задан X_BEARER_TOKEN
    queries_per_direction: 1
    max_results: 10            # 10..100. Чтение платное: $0.005 за пост, 10 постов на запрос ≈ $0.05
    daily_read_limit: 200      # не больше стольких постов X в сутки (UTC) ≈ $1/день; 0 — без лимита
    query_suffix: "-is:retweet -is:reply"
  threads:
    enabled: auto
    # auto: официальный API, если задан THREADS_ACCESS_TOKEN, иначе веб-режим; api | web
    mode: auto
    queries_per_direction: 1   # поиск по словам — только через API
    search_type: TOP           # TOP | RECENT
    limit: 25
    accounts: []               # общие публичные профили (читаются в любом прогоне)
    accounts_per_direction: 2  # сколько аккаунтов направления читать за прогон (по кругу)
    global_accounts_per_run: 3
    # Страница удачного поста показывает 5 «похожих тредов» — близких по теме и языку.
    # Их авторы добавляются в реестр к направлению поста (до max_accounts_per_direction).
    related_authors: true
    max_accounts_per_direction: 25
    # Веб-режим: публичные профили и страницы постов (первые ответы) без входа через
    # headless Chromium. Поиска по словам без входа нет. Автоматический сбор противоречит правилам Meta — на ваш риск.
    # Аккаунты: `ideaminer accounts add/discover`, поле threads_accounts у направлений.
    web:
      enabled: true
      browser: null            # путь к Chromium; null — найти самому (PATH, кэш Playwright)
      no_sandbox: true         # на Ubuntu 24.04 песочница Chromium недоступна; в Docker изолирует контейнер
      min_interval_s: 20       # пауза между страницами
      render_budget_ms: 12000
      max_empty_in_row: 3      # столько пустых страниц подряд — и веб-режим выключается до конца прогона
  rss:
    enabled: true
    # Любые RSS/Atom-ленты, например свой RSSHub для X/Threads:
    # - {url: "https://rsshub.example.com/threads/zuck", platform: threads, direction: wildcard}
    feeds: []
  inbox:
    enabled: true              # импорт файлов из storage.inbox_dir на каждом прогоне

planner:
  core_directions: [pain_hunting]   # берутся в каждый прогон
  # Фокус на регионах, например [cis, eu]: региональные направления других регионов не читаются,
  # а направления этих регионов идут в каждый прогон. Пусто — без фокуса.
  regions: []
  # Усиление: направления региона выпадают во столько раз чаще, другие регионы остаются в игре
  boost_regions: {cis: 3}
  random_directions: 4              # сколько ещё направлений выбрать случайно (с учётом их отдачи)
  wildcard_subreddits: 3            # случайные сабреддиты из пула wildcard_pool
  epsilon: 0.25                     # доля чистого случая против «эксплуатации» удачных направлений
  seed: null                        # число для воспроизводимости, null — каждый раз по-новому

prefilter:
  min_chars: 80
  max_chars: 8000
  max_age_days: 30
  languages: [en, ru, uk, es, pt, de, fr]
  min_reddit_score: 0
  spam_patterns:
    - "(?i)\\b(use|with) (my )?(promo|discount|coupon) code\\b"
    - "(?i)\\bdm me\\b.*\\b(price|offer|deal)\\b"
    - "(?i)\\b(onlyfans|crypto giveaway|airdrop|nsfw)\\b"
    - "(?i)\\b(hiring|we are hiring|job opening)\\b.*\\b(apply|salary)\\b"
    - "(?i)\\bweekly (thread|discussion|self-promotion)\\b"
    - "(?i)\\bsubscribe to my (channel|newsletter)\\b"
  # Сигнальные фразы: вес добавляется к предварительной оценке поста
  signals:
    - {pattern: "(?i)\\bi wish (there (was|were|is)|someone|i could|it)", weight: 3}
    - {pattern: "(?i)\\b(would|i'?d) (happily |gladly )?pay\\b", weight: 3}
    - {pattern: "(?i)\\bis there (an?|any) (app|tool|service|website|software|product|way)\\b", weight: 3}
    - {pattern: "(?i)\\bsomeone (should|needs to) (make|build|create|invent)\\b", weight: 3}
    - {pattern: "(?i)\\bwhy (is there no|isn'?t there|doesn'?t (anyone|any))\\b", weight: 2}
    - {pattern: "(?i)\\b(looking for|need) (a|an) (tool|app|service|solution|alternative)\\b", weight: 2}
    - {pattern: "(?i)\\balternative to\\b", weight: 2}
    - {pattern: "(?i)\\b(frustrat|annoy|tired of|sick of|hate (it )?when|nightmare|pain in the)", weight: 1}
    - {pattern: "(?i)\\b(spreadsheet|manually|by hand|workaround|duct tape|copy[- ]paste)\\b", weight: 1}
    - {pattern: "(?i)\\b(how do you (guys )?(manage|handle|track|organize))\\b", weight: 2}
    - {pattern: "(?i)\\b(wasted|spend(ing)?) (hours|so much time|too much)\\b", weight: 1}
    - {pattern: "(?i)\\b(subscription|overpriced|too expensive|ripoff)\\b", weight: 1}
    - {pattern: "(?i)хоть бы кто[- ]?(нибудь|то)? (сделал|придумал|запилил)", weight: 3}
    - {pattern: "(?i)почему (до сих пор )?(нет|никто не)", weight: 2}
    - {pattern: "(?i)есть ли (какой-?(нибудь|то) )?(сервис|приложение|программа|бот|инструмент)", weight: 3}
    - {pattern: "(?i)(заплатил бы|готов (за)?платить|отдал бы деньги)", weight: 3}
    - {pattern: "(?i)(бесит|задолбал|надоело|достало|неудобно)", weight: 1}
    - {pattern: "(?i)(вручную|в экселе|в таблице|костыл)", weight: 1}
    - {pattern: "(?i)existe (algum|alguma|alguna|algún) (app|aplicativo|aplicación|servi[cç]o|herramienta|ferramenta)", weight: 3}
    - {pattern: "(?i)(ojalá|oxalá) (hubiera|existiera|existisse|tivesse)", weight: 3}
    - {pattern: "(?i)(pagaria|pagaría|zahlen würde|paierais)", weight: 2}

triage:
  batch_size: 20
  max_posts_per_run: 120
  threshold: 7                  # от 0 до 10; ниже — пост не идёт на извлечение идей
  random_share: 0.15            # доля «случайных» постов без сигналов — против туннельного зрения
  max_body_chars: 1500

extract:
  max_posts_per_run: 25
  max_share_per_direction: 0.4  # одно направление занимает не больше 40% разбора за прогон
  max_ideas_per_post: 4
  max_body_chars: 6000
  max_comment_chars: 2500

classify:
  batch_size: 12

dedup:
  candidate_threshold: 0.30     # лексическая похожесть, с которой идеи сравнивает ИИ-судья
  auto_merge_threshold: 0.80    # выше — объединяем без ИИ
  llm_judge: true

scoring:
  # Итоговый балл 0..10 = взвешенная сумма оценок классификатора
  weights:
    demand: 0.30
    monetization: 0.20
    novelty: 0.15
    feasibility: 0.15
    whitespace: 0.10
    urgency: 0.10
  mention_bonus: 0.4            # + за каждое удвоение числа упоминаний одной идеи
  good_idea_threshold: 6.0      # «хорошая» идея — для статистики направлений

explore:
  enabled: true
  every_n_runs: 6               # раз в N прогонов ИИ предлагает новые направления
  new_directions: 2
  prune_min_triaged: 80         # ИИ-направление без отдачи после стольких постов отключается
  prune_min_yield: 0.03         # отключить, если на оценённый пост меньше 0.03 «баллов выше 5»

digest:
  top_n: 15
  min_score: 6.0
  telegram: false               # нужен TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID

web:
  host: 127.0.0.1
  port: 8610

