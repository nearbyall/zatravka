# Research directions. Every run takes core_directions plus a few random ones,
# favouring those with better yield; the LLM explorer adds its own over time.
# Fields: subreddits, reddit_search, x_queries (X API v2 syntax), threads_queries,
# threads_accounts, region and weight.
directions:
  pain_hunting:
    name: "Охота за болями (универсально)"
    weight: 1.0
    search_scope: site
    subreddits: [NoStupidQuestions, mildlyinfuriating, shutupandtakemymoney, INEEEEDIT, Entrepreneur]
    reddit_search:
      - '"I wish there was an app"'
      - '"is there an app that"'
      - '"I would pay for"'
      - '"someone should make"'
      - '"why is there no app"'
      - '"looking for a tool"'
      - '"is there a tool"'
    # X bills returned posts rather than requests, so phrases are joined with OR
    # to fill every max_results slot
    x_queries:
      - '("I wish there was an app" OR "wish there was a tool" OR "someone should build" OR "someone needs to make an app") lang:en'
      - '("I would pay for" OR "I''d pay for" OR "shut up and take my money") (app OR tool OR service) lang:en'
      - '("why is there no app" OR "why isn''t there an app" OR "is there an app that" OR "is there a tool that") lang:en'
      - '("хоть бы кто-нибудь сделал" OR "почему до сих пор нет" OR "есть ли приложение" OR "есть ли сервис" OR "посоветуйте приложение" OR "заплатил бы за") lang:ru'
      - '("does anyone know an app" OR "anyone know a tool" OR "is there a website that" OR "there has to be a better way") lang:en'
      - '("why is it so hard to" OR "why is it impossible to") (find OR book OR cancel OR compare) lang:en'
      - '("I made a spreadsheet" OR "I keep a spreadsheet" OR "my spreadsheet") (track OR tracking) lang:en'
    threads_queries:
      - "I wish there was an app"
      - "someone should build"
      - "would pay for a tool"
      - "есть ли сервис"
      - "почему никто не сделал"

