  inbox:
    enabled: true              # import files from storage.inbox_dir on every run

planner:
  core_directions: [pain_hunting]   # included in every run
  # Regional focus such as [cis, eu]: other regions' directions are skipped and these
  # regions' directions run every time. Empty means no focus.
  regions: []
  # Boost: a region's directions are picked this many times more often; others stay in play
  boost_regions: {cis: 3}
  random_directions: 4              # extra directions sampled by yield
  wildcard_subreddits: 3            # random subreddits from wildcard_pool
  epsilon: 0.25                     # share of pure chance versus exploiting good directions
  seed: null                        # a number for reproducible plans; null means random

prefilter:
  min_chars: 80
  max_chars: 8000
  max_age_days: 30
  languages: [en, ru, uk, es, pt, de, fr]
  min_reddit_score: 0
  spam_patterns:
    - "(?i)\\b(use|with) (my )?(promo|discount|coupon) code\\b"
    - "(?i)\\bdm me\\b.*\\b(price|offer|deal)\\b"
    - "(?i)\\b(onlyfans|crypto giveaway|airdrop|nsfw)\\b"
    - "(?i)\\b(hiring|we are hiring|job opening)\\b.*\\b(apply|salary)\\b"
    - "(?i)\\bweekly (thread|discussion|self-promotion)\\b"
    - "(?i)\\bsubscribe to my (channel|newsletter)\\b"
  # Signal phrases: the weight adds to the post's prefilter score
  signals:
    - {pattern: "(?i)\\bi wish (there (was|were|is)|someone|i could|it)", weight: 3}
    - {pattern: "(?i)\\b(would|i'?d) (happily |gladly )?pay\\b", weight: 3}
    - {pattern: "(?i)\\bis there (an?|any) (app|tool|service|website|software|product|way)\\b", weight: 3}
    - {pattern: "(?i)\\bsomeone (should|needs to) (make|build|create|invent)\\b", weight: 3}
    - {pattern: "(?i)\\bwhy (is there no|isn'?t there|doesn'?t (anyone|any))\\b", weight: 2}
    - {pattern: "(?i)\\b(looking for|need) (a|an) (tool|app|service|solution|alternative)\\b", weight: 2}
    - {pattern: "(?i)\\balternative to\\b", weight: 2}
    - {pattern: "(?i)\\b(frustrat|annoy|tired of|sick of|hate (it )?when|nightmare|pain in the)", weight: 1}
    - {pattern: "(?i)\\b(spreadsheet|manually|by hand|workaround|duct tape|copy[- ]paste)\\b", weight: 1}
    - {pattern: "(?i)\\b(how do you (guys )?(manage|handle|track|organize))\\b", weight: 2}
    - {pattern: "(?i)\\b(wasted|spend(ing)?) (hours|so much time|too much)\\b", weight: 1}
    - {pattern: "(?i)\\b(subscription|overpriced|too expensive|ripoff)\\b", weight: 1}
    - {pattern: "(?i)хоть бы кто[- ]?(нибудь|то)? (сделал|придумал|запилил)", weight: 3}
    - {pattern: "(?i)почему (до сих пор )?(нет|никто не)", weight: 2}
    - {pattern: "(?i)есть ли (какой-?(нибудь|то) )?(сервис|приложение|программа|бот|инструмент)", weight: 3}
    - {pattern: "(?i)(заплатил бы|готов (за)?платить|отдал бы деньги)", weight: 3}
    - {pattern: "(?i)(бесит|задолбал|надоело|достало|неудобно)", weight: 1}
    - {pattern: "(?i)(вручную|в экселе|в таблице|костыл)", weight: 1}
    - {pattern: "(?i)existe (algum|alguma|alguna|algún) (app|aplicativo|aplicación|servi[cç]o|herramienta|ferramenta)", weight: 3}
    - {pattern: "(?i)(ojalá|oxalá) (hubiera|existiera|existisse|tivesse)", weight: 3}
    - {pattern: "(?i)(pagaria|pagaría|zahlen würde|paierais)", weight: 2}

triage:
  batch_size: 20
  max_posts_per_run: 120
  threshold: 7                  # 0..10; posts below it are not extracted
  # Short Threads posts score lower for the same pain, so they pass at 5
  platform_thresholds: {threads: 5}
  random_share: 0.15            # share of random posts without signals, against tunnel vision
  max_body_chars: 1500

extract:
  max_posts_per_run: 25
  max_share_per_direction: 0.4  # one direction takes at most 40% of a run's extraction
  max_ideas_per_post: 4
  max_body_chars: 6000
  max_comment_chars: 2500

classify:
  batch_size: 12

dedup:
  candidate_threshold: 0.30     # lexical similarity from which the LLM judge compares ideas
  auto_merge_threshold: 0.80    # above it ideas merge without the LLM
  llm_judge: true

scoring:
  # The 0..10 score is a weighted sum of the classifier's sub-scores
  weights:
    demand: 0.30
    monetization: 0.20
    novelty: 0.15
    feasibility: 0.15
    whitespace: 0.10
    urgency: 0.10
  mention_bonus: 0.4            # added for each doubling of an idea's mentions
  good_idea_threshold: 6.0      # threshold of a good idea in direction statistics

explore:
  enabled: true
  every_n_runs: 6               # the LLM proposes new directions every N runs
  new_directions: 2
  prune_min_triaged: 80         # an LLM direction without yield after this many triaged posts is disabled
  prune_min_yield: 0.03         # disable below 0.03 points above 5 per triaged post

digest:
  top_n: 15
  min_score: 6.0
  telegram: false               # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID

web:
  host: 127.0.0.1
  port: 8610

