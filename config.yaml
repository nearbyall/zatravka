# zatravka configuration. Paths are relative to this file; secrets live in .env
# (see .env.example).

# The language of generated ideas. Evidence quotes stay in the original language.
output_language: ru

storage:
  db_path: data/zatravka.db
  inbox_dir: data/inbox          # JSON/JSONL/CSV files with posts to import
  exports_dir: data/exports
  digests_dir: data/digests
  prompts_dir: null              # custom prompts folder (default: zatravka/prompts)

http:
  user_agent: "zatravka/0.1 (personal research of public posts)"
  timeout_s: 30
  max_retries: 3
  max_rate_wait_s: 120           # never wait longer than this for a rate limit reset
  # Minimal pause between requests to one host, seconds.
  min_interval_s:
    www.reddit.com: 6.0           # public Reddit RSS is tightly limited; x-ratelimit-* headers are honoured too
    oauth.reddit.com: 1.0
    api.x.com: 1.5
    habr.com: 2.0
    graph.threads.net: 1.0
    default: 1.0

schedule:
  run_every_minutes: 240         # the daemon runs the full pipeline every N minutes
  jitter_minutes: 15             # random shift so runs do not hit the same minute
  digest_hour_utc: 6             # the daily digest is built after this hour

budget:
  # The DeepSeek key is shared with demo projects. A full run costs ≈ $0.09, so this
  # daily limit allows 1–2 runs. Raise daily_usd when using a dedicated key.
  daily_usd: 0.15
  per_run_usd: 0.12

llm:
  providers: [deepseek, replicate]   # in priority order; the next one is the fallback
  concurrency: 4
  timeout_s: 120
  deepseek:
    base_url: https://api.deepseek.com
    models:                          # model per stage
      triage: deepseek-flash
      extract: deepseek-flash
      classify: deepseek-flash
      merge: deepseek-flash
      explore: deepseek-flash
  replicate:
    model: openai/gpt-5-mini
    reasoning_effort: minimal
  # USD per 1M tokens, used for accounting and the budget. deepseek-flash was calibrated on
  # 2026-11-06 against balance charges of two runs (≈ ¥2 input, ¥8 output per 1M tokens).
  prices_usd_per_mtok:
    deepseek-flash:    {in: 0.28,  cached_in: 0.028,  out: 1.10}
    deepseek-v4-pro:   {in: 0.435, cached_in: 0.0036, out: 0.87}
    openai/gpt-5-mini: {in: 0.25,  cached_in: 0.025,  out: 2.0}

sources:
  reddit:
    enabled: true
    mode: auto                 # auto: OAuth when keys are set, otherwise public RSS; rss | oauth
    # Weights for picking the listing type of each feed
    listings: {top_week: 3, hot: 2, new: 1, top_month: 1}
    # Public RSS allows about 1 request per minute, so subreddits are combined into
    # multi-feeds (r/a+b+c) and a run makes few requests. With OAuth (100 requests/min)
    # feeds_per_direction and comments_for_top_posts can go up.
    subs_per_feed: 6           # subreddits per multi-feed
    feeds_per_direction: 1
    searches_per_direction: 1
    items_per_feed: 100
    comments_for_top_posts: 6  # top posts of a run (any platform) to enrich with comments
    comments_per_post: 15
  x:
    enabled: auto              # on when X_BEARER_TOKEN is set
    queries_per_direction: 1
    max_results: 10            # 10..100. Reads are paid: $0.005 per post, so 10 posts ≈ $0.05
    daily_read_limit: 200      # X posts per UTC day ≈ $1/day; 0 means no limit
    query_suffix: "-is:retweet -is:reply"
  threads:
    enabled: auto
    # auto: the official API when THREADS_ACCESS_TOKEN is set, otherwise web mode; api | web
    mode: auto
    queries_per_direction: 1   # keyword search works through the API only
    search_type: TOP           # TOP | RECENT
    limit: 25
    accounts: []               # shared public profiles, read in every run
    accounts_per_direction: 2  # accounts of a direction read per run, round-robin
    global_accounts_per_run: 3
    # A good post's page shows 5 related threads close in topic and language; their
    # authors join the post's direction (up to max_accounts_per_direction).
    related_authors: true
    max_accounts_per_direction: 25
    # Web mode reads public profiles and post pages (first replies) logged out through
    # headless Chromium; there is no keyword search without a login. Automated collection
    # is against Meta's terms, so use it at your own risk. Accounts come from
    # `zatravka accounts add/discover` and the threads_accounts field of directions.
    web:
      enabled: true
      browser: null            # Chromium path; null finds it in PATH or the Playwright cache
      no_sandbox: true         # Ubuntu 24.04 blocks Chromium's sandbox; Docker isolates the container instead
      min_interval_s: 20       # pause between pages
      render_budget_ms: 12000
      max_empty_in_row: 3      # this many empty pages in a row switch web mode off for the run
  rss:
    enabled: true
    # Any RSS/Atom feeds, for example a self-hosted RSSHub for X or Threads:
    # - {url: "https://rsshub.example.com/threads/zuck", platform: threads, direction: wildcard}
